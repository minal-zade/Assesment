<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Employee Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f6f8;
    }

    h1,
    h2 {
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background: white;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    button {
      padding: 6px 12px;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    .edit-btn {
      background-color: #28a745;
    }

    .delete-btn {
      background-color: #dc3545;
    }

    .add-btn {
      background-color: #007bff;
    }

    input {
      padding: 6px;
      margin-right: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    form {
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h1>Employee Management</h1>

  <form id="addForm">
    <h2>Add Employee</h2>
    Name: <input type="text" id="name" required>
    Position: <input type="text" id="position" required>
    <button type="submit" class="add-btn">Add</button>
  </form>

  <table>
    <tr>
      <th>Name</th>
      <th>Position</th>
      <th>Actions</th>
    </tr>
    {% for employee in employees %}
    <tr>
      <td>{{ employee.name }}</td>
      <td>{{ employee.position }}</td>
      <td>
        <button class="edit-btn" onclick="editEmployee('{{ employee.id }}')">Edit</button>
        <button class="delete-btn" onclick="deleteEmployee('{{ employee.id }}')">Delete</button>
      </td>
    </tr>
    {% endfor %}
  </table>

  <script>
    const baseUrl = "/api/employees/";

    // Add Employee
    document.getElementById("addForm").onsubmit = function (e) {
      e.preventDefault();
      let name = document.getElementById("name").value;
      let position = document.getElementById("position").value;

      fetch(baseUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, position })
      }).then(() => location.reload());
    };

    // Edit Employee
    function editEmployee(id) {
      let name = prompt("Enter new name:");
      let position = prompt("Enter new position:");
      if (!name || !position) return;

      fetch(`${baseUrl}${id}/`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, position })
      }).then(() => location.reload());
    }

    // Delete Employee
    function deleteEmployee(id) {
      if (confirm("Are you sure you want to delete this employee?")) {
        fetch(`${baseUrl}${id}/`, { method: "DELETE" })
          .then(() => location.reload());
      }
    }
  </script>
</body>

</html>
